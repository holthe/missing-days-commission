<!DOCTYPE html>
<!--
  Source for /og.png (1200x630). Rendered by `make og`.
  Edit the copy here, not the PNG. Regenerate after any tagline change.

-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #e9e0c9;
    color: #2c2a24;
    font-family: "Courier New", Courier, monospace;
    display: flex; flex-direction: column; text-align: center;
  }
  .rules { flex: none; border-bottom: 3px double #2c2a24; height: 14px; margin: 8px 0 0; border-top: 3px double #2c2a24; }
  .mid {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 0 80px;
  }
  .unit {
    font-size: 19px; letter-spacing: 0.32em; text-transform: uppercase;
    color: #6f6a58;
  }
  h1 {
    font-family: Georgia, serif; font-size: 78px; font-weight: 400;
    margin-top: 16px;
  }
  .caseline { margin-top: 20px; font-size: 21px; }
  .stamp {
    margin-top: 38px;
    display: inline-block; border: 6px solid #a02e24; color: #a02e24;
    font-weight: 700; letter-spacing: 0.24em; padding: 10px 36px;
    transform: rotate(-4deg); text-transform: uppercase; font-size: 32px;
    background: rgba(255,255,255,.25);
  }
  .foot {
    flex: none;
    padding: 0 72px 26px;
    display: flex; justify-content: space-between;
    font-size: 17px; color: #6f6a58;
    text-transform: uppercase; letter-spacing: 0.14em;
  }
</style>
</head>
<body>
  <div class="mid">
    <div class="unit">Cold Cases, Calendrical</div>
    <h1>The Missing Days Commission</h1>
    <div class="caseline">CASE NO. 1752-09 &#183; ELEVEN DAYS &#183; LAST SEEN: SEPTEMBER 2, 1752</div>
    <div class="stamp">Case Open</div>
  </div>
  <div class="foot">
    <span>DOC: BEI-012</span>
    <span>MISSINGDAYS.ORG</span>
    <span>Time passes. Sometimes it skips.</span>
  </div>
</body>
</html>
