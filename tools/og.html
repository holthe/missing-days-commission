<!DOCTYPE html>
<!--
  Source for /og.png (1200x630). Rendered by `make og`.
  Edit the copy here, not the PNG. Regenerate after any tagline change.
  The card is the site in miniature: the case plate pinned to the wall.
  The domain in the footer is the canonical host; if the site moves,
  change it here too and re-run `make og`.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #25282a;
    background-image: radial-gradient(120% 90% at 50% 0%, rgba(255,244,214,.07), transparent 65%);
    color: #ddd8c6;
    font-family: Georgia, "Times New Roman", serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .plate {
    background: #fffdf4; color: #2c2a24;
    width: 780px; padding: 42px 50px 38px;
    transform: rotate(-1.2deg);
    box-shadow: 0 20px 48px rgba(0,0,0,.55);
  }
  .unit { font-family: "Courier New", Courier, monospace;
    font-size: 15px; letter-spacing: .26em; text-transform: uppercase; color: #6f6a58; }
  h1 { font-size: 58px; font-weight: 400; margin-top: 12px; line-height: 1.1; }
  .caseline { font-family: "Courier New", Courier, monospace;
    margin-top: 22px; font-size: 15px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .stamp {
    display: inline-block; border: 4px solid #a02e24; color: #a02e24;
    font-family: "Courier New", Courier, monospace; font-weight: 700; letter-spacing: .2em;
    padding: 5px 16px; transform: rotate(-4deg); text-transform: uppercase; font-size: 17px;
    background: rgba(255,255,255,.25);
  }
  .foot {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 0 60px 26px;
    display: flex; justify-content: space-between;
    font-family: "Courier New", Courier, monospace;
    font-size: 15px; color: #8f8b7d;
    text-transform: uppercase; letter-spacing: .13em;
  }
</style>
</head>
<body>
  <div class="plate">
    <div class="unit">Cold Cases, Calendrical</div>
    <h1>The Missing Days Commission</h1>
    <div class="caseline">
      <span class="stamp">Case Open</span>
      <span>CASE NO. 1752-09 &#183; ELEVEN DAYS &#183; LAST SEEN: SEPT 2, 1752</span>
    </div>
  </div>
  <div class="foot">
    <span>DOC: BEI-012</span>
    <span>MISSINGDAYS.BESTEFFORTINDUSTRIES.COM</span>
    <span>Time passes. Sometimes it skips.</span>
  </div>
</body>
</html>
