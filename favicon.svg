<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>The Missing Days Commission</title>
  <!-- A card pinned to the incident-room wall, with the gap where the
       eleven days should be. Dark wall, cream card, red pin. -->
  <rect width="64" height="64" fill="#25282a"/>
  <rect x="12" y="10" width="40" height="44" fill="#fffdf4" transform="rotate(-3 32 32)"/>
  <g fill="#2c2a24" transform="rotate(-3 32 32)">
    <rect x="18" y="24" width="6" height="5"/>
    <rect x="27" y="24" width="6" height="5"/>
    <rect x="40" y="24" width="6" height="5"/>
    <rect x="18" y="33" width="6" height="5"/>
    <rect x="40" y="33" width="6" height="5"/>
    <rect x="18" y="42" width="6" height="5"/>
    <rect x="27" y="42" width="6" height="5"/>
    <rect x="40" y="42" width="6" height="5"/>
  </g>
  <rect x="27" y="33" width="19" height="5" fill="#b0362c" transform="rotate(-3 32 32)"/>
  <circle cx="32" cy="13" r="5" fill="#c0392b"/>
  <circle cx="30.4" cy="11.4" r="1.6" fill="#e8867a"/>
</svg>
